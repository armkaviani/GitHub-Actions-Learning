name: myFirstWorkflow
# To get trigger on every push in this repo in any branch
on: 
  push:

jobs:
  job1:
    name: JOB1
    runs-on: ubuntu-latest
    steps:
      - name: step-1
        run: 
          pwd
          ls -ltr
          hostname
      - name: step-2 - checkout
        uses: actions/checkout@v6.0.2
      - name: step-3
        run: |
           echo $pwd >> myartifact.txt
           mkdir artifacts
           echo $ls -ltr >> artifacts/list.txt
           echo $hostname >> artifacts/hostname.txt 
      - name: Upload Single File
        uses: actions/upload-artifact@v7.0.0
        with:
          name: Single_file
          path: ./myartifact.txt
      - name: Upload from Directory
        uses: actions/upload-artifact@v7.0.0
        with:
          name: directory_artifacts
          path: artifacts/
      - name: Upload from multiple paths
        uses: actions/upload-artifact@v7.0.0
        with:
          name: multiple_paths
          path: | 
            ./myartifact.txt
            artifacts/
      - name: Upload from multiple paths with exclusions
        uses: actions/upload-artifact@v7.0.0
        with:
          name: multiple_paths_with_exclusions
          path: | 
            ./myartifact.txt
            artifacts/
            !**/hostname.txt
  job2:
     name: JOB2
     runs-on: ubuntu-latest
     needs: job1
     steps:
       - name: checking current directory
         run: |
           pwd
           ls -ltr
       - name: Download single file artifact
         uses: actions/download-artifact@v7.0.0
         with:
           name: Single_file
       - name: Checking current directory post download
         run: |
           pwd
           ls -ltr
           
  job3:
     name: JOB3
     runs-on: ubuntu-latest
     needs: job1
     steps:
       - name: checking current directory
         run: |
           pwd
           ls -ltr
       - name: Download artifact
         uses: actions/download-artifact@v7.0.0
         with:
           name: directory_artifacts
       - name: Checking current directory post download
         run: |
           pwd
           ls -ltr
  job4:
     name: JOB4
     runs-on: ubuntu-latest
     needs: job1
     steps:
       - name: Creating custom folder for download
         run: |
           mkdir -p single_file
           mkdir -p download_directory
       - name: checking current directory
         run: |
           pwd
           ls -ltr
       - name: Download single file artifact
         uses: actions/download-artifact@v7.0.0
         with:
           name: Single_file    
           path: Single_file
       - name: Download artifact
         uses: actions/download-artifact@v7.0.0
         with:
           name: directory_artifacts
           path: download_directory
       - name: Checking current directory post download
         run: |
           pwd
           echo "CHECKING SINGLE DIRECTORY"
           ls -ltr single_file
           ls -ltr download_directory
